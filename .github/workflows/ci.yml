name: GitHub Pages

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    types: [opened, synchronize]

jobs:
  build:
    strategy:
      # Let every OS finish so one failure does not hide the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The Node version is pinned in .nvmrc. Local builds use the same file (`nvm use`).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci installs exactly what package-lock.json records.
      - run: npm ci
      - run: npm run build

      # Deploy once, from the Linux build only.
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.ref == 'refs/heads/master' && matrix.os == 'ubuntu-latest' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
